# adniro: live chat sockets. Put these two blocks inside the site's "server { listen 443 ssl ... }" block
# (/etc/nginx/sites-enabled/adniro.com), above "location / {", then:  nginx -t && systemctl reload nginx
#
# Browsers connect to wss://www.adniro.com/app/<key>; nginx hands that to Reverb on this machine.
# Cloudflare: Network > WebSockets must be On (it is included in the free plan).

location /app/ {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_pass http://127.0.0.1:8080;
}

# Reverb's own HTTP API (PHP uses it on 127.0.0.1 directly): never from outside
location /apps/ {
    return 404;
}
