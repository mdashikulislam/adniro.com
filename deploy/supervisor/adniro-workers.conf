; adniro queue workers (Supervisor). Copy to /etc/supervisor/conf.d/, set the paths and user,
; then: supervisorctl reread && supervisorctl update
;
; Queues: emails (mail), SMS (sms), general jobs (default), photo thumbnails (thumbs), and AI checks (ai) on
; their own worker so a slow AI call never delays an email.
; Needs QUEUE_CONNECTION=redis (Admin > Settings > Optimization > Queue driver) and Redis running.
; stopwaitsecs is above the AI moderation job time-out (300 s), so a check can finish on restart.

[program:adniro-default]
command=php /var/www/adniro.com/artisan queue:work redis --queue=mail,sms,default,thumbs --sleep=3 --tries=3 --max-time=3600
directory=/var/www/adniro.com
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/adniro.com/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB

[program:adniro-ai]
command=php /var/www/adniro.com/artisan queue:work redis --queue=ai --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=/var/www/adniro.com
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/adniro.com/storage/logs/worker-ai.log
stdout_logfile_maxbytes=10MB
